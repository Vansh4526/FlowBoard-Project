<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowBoard — Smart Kanban Task Manager</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="Script.js" defer></script>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="logo">
        <div class="logo-mark">F</div>
        <div class="logo-name">Flow<em>Board</em></div>
      </div>
      <div class="header-right">
        <div class="search-wrap">
          <svg
            class="search-ico"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input type="text" id="search-input" placeholder="Search tasks…" />
        </div>
        <button class="btn btn-primary" onclick="openModal()">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          Add Task
        </button>
      </div>
    </header>

    <!-- SUBBAR -->
    <div class="subbar">
      <div>
        <div class="board-title">My Project Board</div>
        <div class="board-meta" id="board-meta">Loading…</div>
      </div>
      <div class="sort-wrap">
        <span>Sort by</span>
        <select id="sort-select" onchange="renderAll()">
          <option value="score">Priority Score ↓</option>
          <option value="deadline">Deadline ↑</option>
          <option value="title">Title A–Z</option>
          <option value="created">Newest first</option>
        </select>
      </div>
    </div>

    <!-- BOARD -->
    <div class="board" id="board">
      <div
        class="column col-todo"
        data-col="todo"
        ondragover="onDragOver(event)"
        ondrop="onDrop(event, 'todo')"
        ondragleave="onDragLeave(event)"
      >
        <div class="col-header">
          <div class="col-title-wrap">
            <div class="col-dot"></div>
            <div class="col-title">To Do</div>
          </div>
          <span class="col-count" id="count-todo">0</span>
        </div>
        <div class="col-progress">
          <div class="progress-bar">
            <div class="progress-fill" id="prog-todo" style="width: 0%"></div>
          </div>
          <div class="progress-label">
            <span id="prog-todo-label">0 of 0 done</span>
          </div>
        </div>
        <div class="score-legend">⚡ Cards sorted by priority score</div>
        <div class="cards-area" id="cards-todo"></div>
        <button class="add-task-btn" onclick="openModal('todo')">
          ＋ Add task
        </button>
      </div>

      <div
        class="column col-progress-col"
        data-col="inprogress"
        ondragover="onDragOver(event)"
        ondrop="onDrop(event, 'inprogress')"
        ondragleave="onDragLeave(event)"
      >
        <div class="col-header">
          <div class="col-title-wrap">
            <div class="col-dot"></div>
            <div class="col-title">In Progress</div>
          </div>
          <span class="col-count" id="count-inprogress">0</span>
        </div>
        <div class="col-progress">
          <div class="progress-bar">
            <div
              class="progress-fill"
              id="prog-inprogress"
              style="width: 0%"
            ></div>
          </div>
          <div class="progress-label">
            <span id="prog-inprogress-label">0 of 0 done</span>
          </div>
        </div>
        <div class="score-legend">⚡ Cards sorted by priority score</div>
        <div class="cards-area" id="cards-inprogress"></div>
        <button class="add-task-btn" onclick="openModal('inprogress')">
          ＋ Add task
        </button>
      </div>

      <div
        class="column col-review"
        data-col="review"
        ondragover="onDragOver(event)"
        ondrop="onDrop(event, 'review')"
        ondragleave="onDragLeave(event)"
      >
        <div class="col-header">
          <div class="col-title-wrap">
            <div class="col-dot"></div>
            <div class="col-title">Review</div>
          </div>
          <span class="col-count" id="count-review">0</span>
        </div>
        <div class="col-progress">
          <div class="progress-bar">
            <div class="progress-fill" id="prog-review" style="width: 0%"></div>
          </div>
          <div class="progress-label">
            <span id="prog-review-label">0 of 0 done</span>
          </div>
        </div>
        <div class="score-legend">⚡ Cards sorted by priority score</div>
        <div class="cards-area" id="cards-review"></div>
        <button class="add-task-btn" onclick="openModal('review')">
          ＋ Add task
        </button>
      </div>

      <div
        class="column col-done"
        data-col="done"
        ondragover="onDragOver(event)"
        ondrop="onDrop(event, 'done')"
        ondragleave="onDragLeave(event)"
      >
        <div class="col-header">
          <div class="col-title-wrap">
            <div class="col-dot"></div>
            <div class="col-title">Done</div>
          </div>
          <span class="col-count" id="count-done">0</span>
        </div>
        <div class="col-progress">
          <div class="progress-bar">
            <div class="progress-fill" id="prog-done" style="width: 0%"></div>
          </div>
          <div class="progress-label">
            <span id="prog-done-label">0 of 0 done</span>
          </div>
        </div>
        <div class="score-legend">⚡ Cards sorted by priority score</div>
        <div class="cards-area" id="cards-done"></div>
        <button class="add-task-btn" onclick="openModal('done')">
          ＋ Add task
        </button>
      </div>
    </div>

    <!-- ADD TASK MODAL -->
    <div
      class="modal-backdrop hidden"
      id="modal-backdrop"
      onclick="closeModalOnBackdrop(event)"
    >
      <div class="modal">
        <h2>Add New Task</h2>
        <div class="form-group">
          <label>Task Title *</label>
          <input
            type="text"
            id="f-title"
            placeholder="What needs to be done?"
            maxlength="120"
          />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="f-desc" placeholder="Optional details…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Priority</label>
            <select id="f-priority">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🟠 High</option>
              <option value="critical">🔴 Critical</option>
            </select>
          </div>
          <div class="form-group">
            <label>Column</label>
            <select id="f-column">
              <option value="todo">To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="review">Review</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Deadline</label>
            <input type="date" id="f-deadline" />
          </div>
          <div class="form-group">
            <label>Urgency (1–5)</label>
            <select id="f-urgency">
              <option value="1">1 — Not urgent</option>
              <option value="2">2 — Low urgency</option>
              <option value="3" selected>3 — Moderate</option>
              <option value="4">4 — Urgent</option>
              <option value="5">5 — Very urgent</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Impact (1–5)</label>
          <select id="f-impact">
            <option value="1">1 — Minimal impact</option>
            <option value="2">2 — Low impact</option>
            <option value="3" selected>3 — Moderate</option>
            <option value="4">4 — High impact</option>
            <option value="5">5 — Critical impact</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tags (comma separated)</label>
          <input
            type="text"
            id="f-tags"
            placeholder="e.g. design, frontend, bug"
          />
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="addTask()">
            Create Task
          </button>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script></script>
  </body>
</html>
